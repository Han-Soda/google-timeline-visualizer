name: Trace

on:
  push:
    branches: [main]
    paths: ["trace/**", ".github/workflows/trace.yml"]
  pull_request:
    paths: ["trace/**", ".github/workflows/trace.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: trace

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The runner image already has the Android SDK; Gradle fetches anything missing.
      - uses: gradle/actions/setup-gradle@v5
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-apk
          path: |
            trace/app/build/outputs/apk/release/*.apk
            trace/app/build/outputs/apk/debug/*.apk
            trace/app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  export-on-device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Export a video on API ${{ matrix.api-level }}
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          working-directory: trace
          script: ./gradlew connectedDebugAndroidTest --stacktrace
