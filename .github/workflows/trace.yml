name: Trace

on:
  push:
    branches: [main]
    paths: ["trace/**", ".github/workflows/trace.yml"]
  pull_request:
    paths: ["trace/**", ".github/workflows/trace.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: trace

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Goes into the version name, e.g. 1.1-c1d4b8d, and names the APK.
      TRACE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The runner image already has the Android SDK; Gradle fetches anything missing.
      - uses: gradle/actions/setup-gradle@v5
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      # One APK named after its commit, so downloads from different runs can't be mixed up.
      - name: Name the APK after its commit
        id: apk
        run: |
          name="trace-${TRACE_COMMIT::7}"
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: trace-lint
          path: trace/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  export-on-device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Export a video on API ${{ matrix.api-level }}
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          working-directory: trace
          script: ./gradlew connectedDebugAndroidTest --stacktrace
