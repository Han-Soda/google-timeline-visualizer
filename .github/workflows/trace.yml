name: Trace

on:
  push:
    branches: [main]
    paths: ["trace/**", ".github/workflows/trace.yml"]
  pull_request:
    paths: ["trace/**", ".github/workflows/trace.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: trace

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Goes into the version name, e.g. 1.1-c1d4b8d, and names the APK.
      TRACE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The runner image already has the Android SDK; Gradle fetches anything missing.
      - uses: gradle/actions/setup-gradle@v5
      # Google Play needs a bigger version code for every upload, and a release key. With the
      # upload key in the repository's secrets, the bundle and APK are signed with it;
      # without, with the development key, for trying out only.
      - name: Version and signing
        env:
          UPLOAD_KEY: ${{ secrets.TRACE_UPLOAD_KEY }}
          UPLOAD_PASSWORD: ${{ secrets.TRACE_UPLOAD_PASSWORD }}
        run: |
          echo "TRACE_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ -n "$UPLOAD_KEY" ]; then
            echo "$UPLOAD_KEY" | base64 -d > "$RUNNER_TEMP/upload.p12"
            {
              echo "TRACE_KEYSTORE=$RUNNER_TEMP/upload.p12"
              echo "TRACE_KEYSTORE_PASSWORD=$UPLOAD_PASSWORD"
              echo "TRACE_KEY_ALIAS=upload"
              echo "TRACE_KEY_PASSWORD=$UPLOAD_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key in the secrets: signed with the development key, not for Google Play."
          fi
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --stacktrace
      # One APK and one bundle for Google Play, named after their commit, so downloads from
      # different runs can't be mixed up, with the R8 mapping for Play's crash reports.
      - name: Name the APK and bundle after their commit
        id: apk
        run: |
          name="trace-${TRACE_COMMIT::7}"
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/$name.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/apk/$name.aab"
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/apk/$name-mapping.txt"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ runner.temp }}/apk/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: trace-lint
          path: trace/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  export-on-device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Export a video on API ${{ matrix.api-level }}
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          working-directory: trace
          script: ./gradlew connectedDebugAndroidTest --stacktrace

  # Phone screenshots for the Play listing, in English and Russian, taken from the app itself
  # with a made-up trip, at 1080 × 1920, into trace/play-store/screenshots. Run the workflow by
  # hand to take them.
  store-screenshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take the screenshots
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          # A British phone: 24-hour times and day-month dates, natural in both languages.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -change-locale en-GB
          disable-animations: true
          working-directory: trace
          # Whatever was taken is kept, even when the test stops part way.
          script: >-
            ./gradlew connectedDebugAndroidTest --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.class=io.github.hansoda.trace.StoreScreenshots
            -Pandroid.testInstrumentationRunnerArguments.screenshots=true;
            code=$?; adb pull /sdcard/Pictures/Trace "$RUNNER_TEMP/screenshots"; exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: error
      # Kept next to the rest of the listing, where they can be looked at without downloading.
      - name: Commit the screenshots
        working-directory: .
        run: |
          folder=trace/play-store/screenshots
          rm -rf "$folder" && mkdir -p "$folder"
          cp "$RUNNER_TEMP"/screenshots/*.png "$folder"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$folder"
          git diff --cached --quiet && exit 0
          git commit -m "Store screenshots from run $GITHUB_RUN_NUMBER"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
